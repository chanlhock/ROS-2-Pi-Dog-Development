# PiDog ROS 2 Configuration Parameters

/**:
  ros__parameters:
    # Movement parameters
    forward_speed: 98
    turn_speed: 98
    obstacle_distance: 30
    backward_time: 1.0
    turn_time: 0.6
    forward_interval: 0.2
    
    # Distance sensor parameters
    publish_frequency: 10.0
    distance_timeout: 2.0
    moving_average_window: 5
    
    # Camera parameters
    camera_device: 0
    image_width: 640
    image_height: 480
    fps: 15
    enable_face_detection: true
    save_photos: false
    photo_save_path: "/home/ros/Pictures/pidog/"
    
    # IMU parameters
    simulate_imu: true
    use_hardware_imu: false
    
    # Touch sensor parameters
    touch_threshold: 0.8
    debounce_ms: 100
    simulate_touch: false
    
    # Sound direction parameters
    sound_enabled: true
    sample_rate: 16000
    chunk_size: 1024
    sound_energy_threshold: 500
    simulate_sound: true
    
    # TTS parameters
    tts_model: "en_US-ryan-low"
    voice_volume: 0.8
    speak_rate: 1.0
    use_piper: true
    use_espeak: false
    
    # STT parameters
    stt_enabled: true
    model_path: "/pidog/woofer/vosk-model-small-en-us-0.15"
    silence_timeout: 2.0
    speech_timeout: 10.0
    
    # Behavior parameters
    emotion_interval: 30
    mse_threshold: 20
    stuck_distance: 10
    start_turn_distance: 80

# Node-specific parameters for Distance Node
pidog_distance_node:
  ros__parameters:
    # Override global parameters
    publish_frequency: 10.0
    distance_timeout: 2.0
    moving_average_window: 5
    
    # NEW: Hardware control settings (to avoid GPIO conflict
    enable_hardware: false           # Disable hardware access (movement_node will handle it)
    enable_head_scanning: false      # Disable head scanning to reduce conflicts
    use_simulation: true             # Run in simulation mode since hardware is disabled

# Node-specific parameters for Movement Node
pidog_movement_node:
  ros__parameters:
    # Movement parameters (override if needed)
    forward_speed: 98
    turn_speed: 98
    
    # NEW: Hardware control settings
    enable_hardware: false            # Movement node controls the hardware
    use_simulation: true            # Use real hardware
    #enable_sensors: false            # Don't initialize sensors (to avoid conflicts) 

# Node-specific parameters for Autonomous Node
ros2_autonomous_pidog:
  ros__parameters:
    # Behavior parameters
    wandering_speed: 98
    obstacle_distance: 30
    forward_interval: 0.2
    turn_time: 0.6
    backward_time: 1.0
    
    # NEW: Enable/disable features to reduce conflicts
    enable_head_scanning: false      # Disable head scanning in autonomous node
    enable_sound_turning: true       # Allow turning towards sounds
    enable_face_interaction: true    # Allow face detection interaction
    personality_actions: true        # Enable random personality actions

# Node-specific parameters for IMU Node (if exists)
pidog_imu_node:
  ros__parameters:
    simulate_imu: false
    use_hardware_imu: true

# Node-specific parameters for Dual Touch Node
pidog_dual_touch_node:
  ros__parameters:
    touch_threshold: 0.8
    debounce_ms: 100
    simulate_touch: true

# Node-specific parameters for Direction Sensor Node
pidog_direction_sensor_node:
  ros__parameters:
    sound_enabled: true
    sample_rate: 16000
    chunk_size: 1024
    sound_energy_threshold: 500
    simulate_sound: true

# Node-specific parameters for Camera Node
pidog_camera_node:
  ros__parameters:
    camera_device: 0
    image_width: 640
    image_height: 480
    fps: 15
    enable_face_detection: true

# Node-specific parameters for TTS Node
pidog_tts_speaks_node:
  ros__parameters:
    tts_model: "en_US-ryan-low"
    voice_volume: 0.8
    speak_rate: 1.0
    use_piper: true                 # Set to false since model not found
    use_espeak: false                 # Use espeak as fallback
    
# Node-specific parameters for STT Node
pidog_stt_voice_command_node:
  ros__parameters:
    stt_enabled: true
    model_path: "/pidog/woofer/vosk-model-small-en-us-0.15"
    silence_timeout: 2.0
    speech_timeout: 10.0